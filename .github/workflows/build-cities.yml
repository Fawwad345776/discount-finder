name: Build world cities list
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/build-cities.mjs', '.github/workflows/build-cities.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download GeoNames (cities with 5000+ people)
        run: |
          curl -sSfL -o /tmp/c.zip https://download.geonames.org/export/dump/cities5000.zip
          unzip -o /tmp/c.zip -d /tmp
      - run: node scripts/build-cities.mjs /tmp/cities5000.txt
      - name: Commit and publish
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/cities
          git diff --cached --quiet || git commit -m "Update world cities list (GeoNames, CC BY 4.0)"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
