name: Fetch deals (every 6 hours)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
concurrency: fetch-deals
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - name: Run Python scraper (Instagram, Facebook, websites + cleanup)
        run: python scraper/scrape.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SKIP_FACEBOOK: '1'
          MAX_MINUTES: '45'
