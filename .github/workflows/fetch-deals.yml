name: Fetch deals (every 6 hours)
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}
concurrency: fetch-deals
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - name: Restore run cache (brands + deals list from earlier runs)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dbstate-${{ github.run_id }}
          restore-keys: dbstate-
      - name: Run Python scraper (Instagram, Facebook, websites + cleanup)
        run: python scraper/scrape.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SKIP_FACEBOOK: '1'
          MAX_MINUTES: '95'
          STATE_FILE: .state/db.json
      - name: Save run cache
        if: always() && hashFiles('.state/db.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dbstate-${{ github.run_id }}
      - name: Publish live deal files to the website
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live || exit 0
          git commit -q -m "live deals update" || exit 0
          git pull -q --rebase -X theirs origin main
          git push -q origin HEAD:main
          git push -q -f origin HEAD:gh-pages
