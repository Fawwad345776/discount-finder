name: Fetch deals (every 6 hours)
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}
concurrency: fetch-deals
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - name: Restore run cache (brands + deals list from earlier runs)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dbstate-${{ github.run_id }}
          restore-keys: dbstate-
      - name: Run Python scraper (Instagram, Facebook, websites + cleanup)
        run: python scraper/scrape.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SKIP_FACEBOOK: '1'
          MAX_MINUTES: '95'
          DISCOVER_COUNTRIES: '0'   # AI brand search off: brands are added by hand (brands-seed.json)
          STATE_FILE: .state/db.json
      - name: Save run cache
        if: always() && hashFiles('.state/db.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dbstate-${{ github.run_id }}
      - name: Publish live deal files to the website
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live || exit 0
          git commit -q -m "live deals update" || exit 0
          git pull -q --rebase -X theirs origin main
          git push -q origin HEAD:main
          git push -q -f origin HEAD:gh-pages

  # GitHub's own schedule is unreliable (runs are often hours late or skipped).
  # So every run starts the next one itself, 2 hours after it began. If a newer run
  # already exists (from the schedule or cron-job.org), this one steps aside.
  next:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: write
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          started=$(gh api repos/$REPO/actions/runs/$RUN_ID --jq .created_at)
          wait=$(( $(date -d "$started" +%s) + 7200 - $(date +%s) ))
          echo "Next run in $wait seconds"
          [ $wait -gt 0 ] && sleep $wait
          newer=$(gh api "repos/$REPO/actions/workflows/fetch-deals.yml/runs?per_page=10" \
                  --jq "[.workflow_runs[] | select(.id != $RUN_ID and .created_at > \"$started\")] | length")
          if [ "$newer" != "0" ]; then echo "A newer run already exists, not starting another"; exit 0; fi
          gh api -X POST repos/$REPO/actions/workflows/fetch-deals.yml/dispatches -f ref=main
          echo "Next run started"
