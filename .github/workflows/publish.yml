name: Publish site
on:
  push:
    branches: [main]
    paths-ignore: ['data/cities/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish latest main (keeps the cities list)
        run: |
          git fetch origin main
          git push -f origin origin/main:gh-pages
